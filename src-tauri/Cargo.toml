[package]
name = "layercut"
version = "0.4.0"
description = "LayerCut - non-destructive 2D layer occlusion & layered export tool"
authors = ["LayerCut"]
edition = "2021"

[lib]
name = "layercut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
