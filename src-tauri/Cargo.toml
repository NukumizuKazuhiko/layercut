[package]
name = "layercut"
version = "0.4.0"
description = "LayerCut - non-destructive 2D layer occlusion & layered export tool"
authors = ["LayerCut"]
edition = "2021"

[lib]
name = "layercut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# `custom-protocol` must be selectable as a feature: `tauri`'s build script
# derives its `dev` cfg from `dev = !custom_protocol`, and the `dev` cfg decides
# whether the window is pointed at `devUrl` (http://localhost:5173) or at the
# bundled assets over `tauri://localhost`. The Tauri CLI turns this feature on
# for production builds; declaring it here is what makes `tauri build` produce
# a self-contained binary instead of one that loads the (absent) dev server and
# shows a black window.
[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
